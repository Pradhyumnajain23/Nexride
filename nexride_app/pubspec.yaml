name: nexride
description: NexRide – AI-powered public transport system
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ─────────────────────────────────────
  go_router: ^14.2.7

  # ── State Management ───────────────────────────────
  provider: ^6.1.2

  # ── HTTP & API ─────────────────────────────────────
  dio: ^5.4.3

  # ── Local Storage ──────────────────────────────────
  shared_preferences: ^2.2.3

  # ── Map (Google Maps) ──────────────────────────────
  google_maps_flutter: ^2.9.0


  # ── OTP Input ──────────────────────────────────────
  pinput: ^5.0.0

  # ── QR Code ────────────────────────────────────────
  qr_flutter: ^4.1.0

  # ── Animations ─────────────────────────────────────
  lottie: ^3.1.2
  animate_do: ^3.3.4
  shimmer: ^3.0.0

  # ── Google Sign-In + Firebase ───────────────────────
  google_sign_in: ^6.2.1
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0

  # ── UI Extras ──────────────────────────────────────
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
